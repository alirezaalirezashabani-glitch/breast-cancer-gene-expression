name: Run GSE103001 RNA-seq analysis

on:
  push:
    paths:
      - "scripts/make_GSE103001_figures.R"
      - "data/GSE103001_sample_metadata.csv"
      - ".github/workflows/run-gse103001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install Bioconductor packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-pandoc: false
          packages: |
            any::ggplot2
            any::pheatmap
            any::matrixStats
            bioc::GEOquery
            bioc::DESeq2
            bioc::AnnotationDbi
            bioc::org.Hs.eg.db

      - name: Run paired RNA-seq analysis and generate figures
        run: Rscript scripts/make_GSE103001_figures.R

      - name: Commit generated data, tables, and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/GSE103001_counts_matrix.csv results/GSE103001
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Add GSE103001 differential expression results and figures"
            git push
          fi
