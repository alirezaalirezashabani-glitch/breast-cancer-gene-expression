name: Run GSE103001 RNA-seq analysis

on:
  push:
    paths:
      - "scripts/make_GSE103001_figures.R"
      - "data/GSE103001_sample_metadata.csv"
      - ".github/workflows/run-gse103001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_20
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"), Ncpus = 2)
          if (!requireNamespace("BiocManager", quietly = TRUE))
            install.packages("BiocManager")
          BiocManager::install(
            c("GEOquery", "DESeq2", "AnnotationDbi", "org.Hs.eg.db"),
            ask = FALSE, update = FALSE
          )
          install.packages(c("ggplot2", "pheatmap", "matrixStats"))

      - name: Run paired RNA-seq analysis and generate figures
        run: Rscript scripts/make_GSE103001_figures.R

      - name: Commit generated data, tables, and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/GSE103001_counts_matrix.csv results/GSE103001
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Add GSE103001 differential expression results and figures"
            git push
          fi
