name: Run GSE103001 RNA-seq analysis

on:
  push:
    paths:
      - "scripts/make_GSE103001_figures.R"
      - "data/GSE103001_sample_metadata.csv"
      - ".github/workflows/run-gse103001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_20
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"), Ncpus = 2)
          if (!requireNamespace("BiocManager", quietly = TRUE))
            install.packages("BiocManager")
          BiocManager::install(
            c("GEOquery", "DESeq2", "AnnotationDbi", "org.Hs.eg.db"),
            ask = FALSE, update = FALSE
          )
          install.packages(c("ggplot2", "pheatmap", "matrixStats"))

      - name: Run paired RNA-seq analysis and generate figures
        run: Rscript scripts/make_GSE103001_figures.R

      - name: Upload reproducible analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: GSE103001-RNA-seq-results
          path: |
            data/GSE103001_counts_matrix.csv
            results/GSE103001/
          if-no-files-found: error
          retention-days: 30

      - name: Add run summary
        shell: bash
        run: |
          {
            echo "## GSE103001 paired RNA-seq analysis"
            echo ""
            echo "- Contrast: Tumour vs paired adjacent normal"
            echo "- Model: DESeq2, ~ patient_id + group"
            echo "- Main output: differential expression table and figures"
            echo "- Download: Actions run → Artifacts → GSE103001-RNA-seq-results"
            echo "- Interpretation: patient-tissue association; not a beta-cyclocitral treatment experiment"
          } >> "$GITHUB_STEP_SUMMARY"
